# docker-compose.yml
# ВАЖНО — почему моды "пропадали после обновления": Docker при пересборке
# образа (docker build) создаёт файловую систему контейнера заново, из
# того, что скопировано командой COPY в Dockerfile. База данных
# (data/modbuild.db) и загруженные файлы (public/uploads/*) специально НЕ
# лежат в git (см. .gitignore) — это runtime-данные, а не код. Значит при
# каждой пересборке контейнер стартовал с чистого листа: пустая база,
# пустые загрузки. Именно поэтому моды "исчезали" при каждом обновлении —
# это не баг сайта, а особенность Docker без постоянного тома.
#
# Решение — volumes ниже: они «пробрасывают» папки data/ и
# public/uploads/ с диска VPS внутрь контейнера. Пересобирается и
# перезапускается только код приложения, а данные живут на диске сервера
# отдельно от контейнера и переживают любую пересборку.
#
# Запуск на VPS:
#   docker compose up -d --build
# Обновление после git pull:
#   docker compose up -d --build
# (без --build, если менялся только .env — тогда просто `docker compose up -d`)

services:
  alem-mod:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
